[package]
name = "mc-launcher"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A Minecraft launcher for GNOME, built with GTK4 + libadwaita"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/mc-launcher"

[dependencies]
# --- GTK / GNOME ---
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# --- Errors / logging ---
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- Networking (auth, news, versions, skins) ---
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

# --- Thread -> GTK main loop ---
async-channel = "2"

# --- Minecraft backend ---
# If cargo complains about the version, run: cargo add mc-launcher-core
mc-launcher-core = "0.1"

[profile.release]
lto = "thin"
strip = true
